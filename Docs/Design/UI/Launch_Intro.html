<meta charset="utf-8">
<title>Saltbound Launch Intro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Layout: the 1920x1080 intro as the hero, a replay button and a scrubber under it, then the storyboard. Single dark look on purpose. */
:root{--bg:#0b1014;--fg:#d3d9da;--muted:#7f8a8e;--line:#1f2a30;--accent:#5ae6d2;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:400 15px/1.5 "Alegreya",Georgia,serif;padding-inline:16px;padding-block:24px 48px}
.wrap{max-width:1500px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
h1{font:400 clamp(1.8rem,3.6vw,2.6rem)/1.1 "IM Fell English",Georgia,serif;margin:0;text-wrap:balance}
.lede{color:var(--muted);max-width:72ch;margin:6px 0 0;font-style:italic}
canvas{display:block;width:100%;height:auto;max-width:100%;border-radius:8px;background:#000}
.ctl{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.ctl button{font:500 1rem/1 "Alegreya",Georgia,serif;color:var(--fg);background:#16222a;border:1px solid #2c3c45;border-radius:6px;padding:9px 16px;cursor:pointer}
.ctl button:hover{border-color:var(--accent)}
.ctl button:focus-visible,.ctl input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ctl input{flex:1;min-width:200px;accent-color:var(--accent)}
.ctl output{font:400 1rem/1 "IM Fell English",Georgia,serif;color:var(--muted);min-width:5ch;font-variant-numeric:tabular-nums}
ol{margin:6px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:10px 24px}
li{display:flex;gap:12px;border-top:1px solid var(--line);padding-top:8px;color:var(--fg)}
li span{font:400 .95rem/1.4 "IM Fell English",Georgia,serif;color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
body.solo{padding:0;overflow:hidden;background:#000}
body.solo .wrap{max-width:none;gap:0}
body.solo .wrap>*:not(canvas){display:none}
body.solo canvas{width:1920px;border-radius:0}
</style>
<div class="wrap">
  <header><h1>The knot becomes the name</h1><p class="lede">The launch intro, 8.5 seconds. The knotted ring inks in and finds north. Its compass points burst into the letters, the ring's big rope grows into the underline, and the finished title glides up into its place in the start menu.</p></header>
  <canvas id="c-intro" width="1920" height="1080"></canvas>
  <div class="ctl"><button type="button" id="replay">Replay</button><input type="range" id="scrub" min="0" max="850" value="0" aria-label="Scrub through the intro"><output id="tlabel">0.00 s</output></div>
  <ol id="story"></ol>
</div>
<script>
/* ===== toolkit ===== */
const W=1920,H=1080,TAU=Math.PI*2;
function rng(seed){let s=seed>>>0||1;return()=>{s=Math.imul(s^s>>>15,1|s);s=s+Math.imul(s^s>>>7,61|s)^s;return((s^s>>>14)>>>0)/4294967296}}
function makeNoise(seed){
  const r=rng(seed),perm=[...Array(256).keys()];
  for(let i=255;i>0;i--){const j=Math.floor(r()*(i+1));[perm[i],perm[j]]=[perm[j],perm[i]]}
  const p=new Uint8Array(512);for(let i=0;i<512;i++)p[i]=perm[i&255];
  const gx=new Float32Array(256),gy=new Float32Array(256);for(let i=0;i<256;i++){const a=r()*TAU;gx[i]=Math.cos(a);gy[i]=Math.sin(a)}
  return(x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,X=xi&255,Y=yi&255;
    const d=(i,j)=>{const k=p[p[X+i]+Y+j];return gx[k]*(xf-i)+gy[k]*(yf-j)};
    const u=xf*xf*xf*(xf*(xf*6-15)+10),v=yf*yf*yf*(yf*(yf*6-15)+10);
    const a=d(0,0)+(d(1,0)-d(0,0))*u,b=d(0,1)+(d(1,1)-d(0,1))*u;return(a+(b-a)*v)*1.4}
}
const N1=makeNoise(11),N2=makeNoise(23),N3=makeNoise(37),N4=makeNoise(51);
function fbm(n,x,y,o=4){let s=0,a=.5,f=1;for(let i=0;i<o;i++){s+=a*n(x*f,y*f);f*=2.03;a*=.5}return s}
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v,mix=(a,b,t)=>a+(b-a)*t,sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a));return t*t*(3-2*t)};
function canvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function tex(w,h,fn){const c=canvas(w,h),x=c.getContext('2d'),im=x.createImageData(w,h),d=im.data;
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){const o=(j*w+i)*4,v=fn(i,j);d[o]=v[0];d[o+1]=v[1];d[o+2]=v[2];d[o+3]=v[3]??255}
  x.putImageData(im,0,0);return c}

/* leather: mottled tone, pebble grain with creases, pale scuffs */
function leather(w,h,base,seed=0,opt={}){
  const [r,g,b]=base,sc=opt.scuff??1,gr=opt.grain??1;
  return tex(w,h,(x,y)=>{x+=seed*977;y+=seed*613;
    const m=fbm(N1,x/260,y/260,4),cr=Math.abs(N2(x/7.5,y/7.5)),pb=N3(x/2.6,y/2.6),
      scuff=sstep(.22,.5,fbm(N4,x/120,y/70,3))*sc,crease=sstep(.0,.12,cr);
    let k=(1+.22*m)*(.84+.16*crease)*(1+.05*pb*gr);
    let R=r*k,G=g*k,B=b*k;
    R=mix(R,R*1.35+18,scuff*.55);G=mix(G,G*1.32+14,scuff*.55);B=mix(B,B*1.25+8,scuff*.55);
    return[R,G,B]})}
/* wood planks along x: grain stripes bent by noise, fibres, a knot or two */
function wood(w,h,base,seed=0,knots=[]){
  const [r,g,b]=base;
  return tex(w,h,(x,y)=>{const X=x+seed*733,Y=y+seed*311;
    let t=Y*.11+fbm(N1,X/420,Y/60,3)*7+N2(X/90,Y/9)*.9;
    for(const [kx,ky,ks] of knots){const dx=(x-kx)/ks,dy=(y-ky)/(ks*.55),d2=dx*dx+dy*dy;t+=5/(1+d2*1.6)}
    const ring=.5+.5*Math.sin(t*TAU*.5),late=sstep(.55,.95,ring),fib=N3(X/3,Y/38)*.5+N4(X/1.2,Y/14)*.3,tone=fbm(N4,X/300,Y/120,2);
    const k=(.92+.16*tone)*(1-.24*late)*(1+.07*fib);
    return[r*k,g*k,b*k]})}
function parchment(w,h,seed=0){
  return tex(w,h,(x,y)=>{const X=x+seed*97,Y=y+seed*53;
    const m=fbm(N1,X/160,Y/160,4),st=sstep(.15,.5,fbm(N2,X/90,Y/90,3)),fib=N3(X/1.5,Y/9)*.5+N4(X/9,Y/1.5)*.3;
    const k=(1+.06*m+.03*fib)*(1-.12*st);return[230*k,208*k,160*k-6*st]})}

/* paths */
function rr(x,y,w,h,r){const p=new Path2D();const R=typeof r==='number'?[r,r,r,r]:r;
  p.moveTo(x+R[0],y);p.lineTo(x+w-R[1],y);p.arcTo(x+w,y,x+w,y+R[1],R[1]);p.lineTo(x+w,y+h-R[2]);p.arcTo(x+w,y+h,x+w-R[2],y+h,R[2]);
  p.lineTo(x+R[3],y+h);p.arcTo(x,y+h,x,y+h-R[3],R[3]);p.lineTo(x,y+R[0]);p.arcTo(x,y,x+R[0],y,R[0]);p.closePath();return p}
function rrPts(x,y,w,h,r){const pts=[],arc=(cx,cy,a0)=>{for(let i=0;i<=12;i++){const a=a0+i/12*Math.PI/2;pts.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r])}};
  arc(x+w-r,y+r,-Math.PI/2);arc(x+w-r,y+h-r,0);arc(x+r,y+h-r,Math.PI/2);arc(x+r,y+r,Math.PI);pts.push(pts[0]);return pts}
/* walk a polyline and call fn(x,y,angle) every `step` px */
function walk(pts,step,fn,off=0){let acc=off;for(let i=0;i<pts.length-1;i++){const [ax,ay]=pts[i],[bx,by]=pts[i+1],L=Math.hypot(bx-ax,by-ay),a=Math.atan2(by-ay,bx-ax);
  while(acc<L){fn(ax+(bx-ax)*acc/L,ay+(by-ay)*acc/L,a);acc+=step}acc-=L}}
/* saddle stitching: holes, a shadowed thread, a highlight */
function stitches(c,pts,{step=15,len=9,w=3.2,col='#d9c08e',dark='rgba(20,10,4,.75)'}={}){
  c.save();c.lineCap='round';
  walk(pts,step,(x,y,a)=>{const dx=Math.cos(a)*len/2,dy=Math.sin(a)*len/2;
    c.fillStyle=dark;c.beginPath();c.arc(x-dx*1.25,y-dy*1.25,w*.55,0,TAU);c.arc(x+dx*1.25,y+dy*1.25,w*.55,0,TAU);c.fill();
    c.strokeStyle=dark;c.lineWidth=w+1.4;c.beginPath();c.moveTo(x-dx+.8,y-dy+1.4);c.lineTo(x+dx+.8,y+dy+1.4);c.stroke();
    c.strokeStyle=col;c.lineWidth=w;c.beginPath();c.moveTo(x-dx,y-dy);c.lineTo(x+dx,y+dy);c.stroke();
    c.strokeStyle='rgba(255,246,220,.55)';c.lineWidth=w*.35;c.beginPath();c.moveTo(x-dx*.7,y-dy*.7-.7);c.lineTo(x+dx*.7,y+dy*.7-.7);c.stroke()});
  c.restore()}
function innerShadow(c,path,blur,color,ox=0,oy=0){c.save();c.clip(path);const big=new Path2D();big.rect(-4000,-4000,9000,9000);big.addPath(path);
  c.shadowBlur=blur;c.shadowColor=color;c.shadowOffsetX=ox;c.shadowOffsetY=oy;c.fillStyle='#000';c.fill(big,'evenodd');c.restore()}
function dropShadow(c,path,blur,color,ox=0,oy=0,rule='nonzero'){c.save();c.shadowBlur=blur;c.shadowColor=color;c.shadowOffsetX=ox;c.shadowOffsetY=oy;c.fillStyle='#000';c.fill(path,rule);c.restore()}
function fillTex(c,path,img,dx=0,dy=0){c.save();c.clip(path);c.drawImage(img,dx,dy);c.restore()}
/* a soft bevel: light rim on top-left, dark on bottom-right */
function bevel(c,path,s=1){innerShadow(c,path,10*s,'rgba(255,225,170,.28)',3*s,4*s);innerShadow(c,path,14*s,'rgba(0,0,0,.6)',-3*s,-5*s)}
/* brass: a ring or disc with sharp highlight bands and patina in the hollows */
function brassGrad(c,x0,y0,x1,y1){const g=c.createLinearGradient(x0,y0,x1,y1);
  [[0,'#5a3b12'],[.18,'#c8973e'],[.3,'#fbe3a0'],[.38,'#d9a748'],[.62,'#7a5418'],[.78,'#b9883a'],[.9,'#e8c77c'],[1,'#4a300e']].forEach(([o,k])=>g.addColorStop(o,k));return g}
function brassRing(c,x,y,r1,r0){c.save();const p=new Path2D();p.arc(x,y,r1,0,TAU);p.arc(x,y,r0,0,TAU,true);
  dropShadow(c,p,8,'rgba(0,0,0,.6)',2,4);c.fillStyle=brassGrad(c,x-r1,y-r1,x+r1,y+r1);c.fill(p);
  c.strokeStyle='rgba(40,25,5,.7)';c.lineWidth=1.5;c.stroke(p);
  c.globalCompositeOperation='overlay';const n=(r1+r0)/2;c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=(r1-r0)*.25;c.beginPath();c.arc(x,y,n,Math.PI*1.05,Math.PI*1.55);c.stroke();c.restore()}
function rivet(c,x,y,r=5){const g=c.createRadialGradient(x-r*.35,y-r*.4,r*.1,x,y,r);g.addColorStop(0,'#fff0c0');g.addColorStop(.35,'#c99b45');g.addColorStop(1,'#3e2a0c');
  c.save();c.shadowBlur=3;c.shadowColor='rgba(0,0,0,.7)';c.shadowOffsetY=1.5;c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,TAU);c.fill();c.restore()}
function ironRivet(c,x,y,r=5){const g=c.createRadialGradient(x-r*.35,y-r*.4,r*.1,x,y,r);g.addColorStop(0,'#9a958c');g.addColorStop(.4,'#3c3833');g.addColorStop(1,'#141210');
  c.save();c.shadowBlur=3;c.shadowColor='rgba(0,0,0,.8)';c.shadowOffsetY=1.5;c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,TAU);c.fill();c.restore()}
/* text */
function txt(c,s,x,y,font,col,{align='left',shadow=null,base='alphabetic',ls=0}={}){c.save();c.font=font;c.textAlign=align;c.textBaseline=base;if(ls)c.letterSpacing=ls+'px';
  if(shadow){c.shadowColor=shadow[0];c.shadowBlur=shadow[1];c.shadowOffsetX=shadow[2]||0;c.shadowOffsetY=shadow[3]||0}c.fillStyle=col;c.fillText(s,x,y);c.restore()}
/* pressed into leather: dark core, light lower lip */
function deboss(c,s,x,y,font,{align='left',ls=0,col='rgba(30,14,5,.72)'}={}){txt(c,s,x,y+1.6,font,'rgba(255,215,160,.22)',{align,ls});txt(c,s,x,y,font,col,{align,ls,shadow:['rgba(0,0,0,.6)',2,0,-1]})}
function wrap(c,s,x,y,maxW,lh,font,col){c.save();c.font=font;c.fillStyle=col;let line='',yy=y;for(const w of s.split(' ')){const t=line?line+' '+w:w;if(c.measureText(t).width>maxW&&line){c.fillText(line,x,yy);line=w;yy+=lh}else line=t}c.fillText(line,x,yy);c.restore();return yy}
function img(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=src})}
/* a small leather keycap with a brass rim */
function keycap(c,k,x,y,s=34){const p=rr(x,y,s+(k.length>1?(k.length-1)*12:0),s,7),w=s+(k.length>1?(k.length-1)*12:0);
  dropShadow(c,p,4,'rgba(0,0,0,.6)',0,2);const g=c.createLinearGradient(0,y,0,y+s);g.addColorStop(0,'#5b3a22');g.addColorStop(1,'#2a170b');c.fillStyle=g;c.fill(p);
  c.save();c.strokeStyle=brassGrad(c,x,y,x+w,y+s);c.lineWidth=2.4;c.stroke(p);c.restore();
  txt(c,k,x+w/2,y+s/2+1,`700 ${Math.round(s*.5)}px Alegreya,Georgia,serif`,'#f3e6c8',{align:'center',base:'middle'});return w}
/* the game view behind the screens */
function backdrop(c,bg,{blur=0,dark=1,vig=.55}={}){c.save();if(blur)c.filter=`blur(${blur}px) brightness(${dark}) saturate(.9)`;else c.filter=`brightness(${dark})`;
  const m=blur*3+24;c.drawImage(bg,-m,-m,W+2*m,H+2*m);c.restore();
  const g=c.createRadialGradient(W/2,H*.55,H*.3,W/2,H*.55,H*1.05);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${vig})`);c.fillStyle=g;c.fillRect(0,0,W,H)}
/* ===== tool wheel ===== */
function ropeRing(c,cx,cy,R,T){
  const band=new Path2D();band.arc(cx,cy,R+T/2,0,TAU);band.arc(cx,cy,R-T/2,0,TAU,true);
  c.save();c.shadowBlur=22;c.shadowColor='rgba(0,0,0,.7)';c.shadowOffsetY=12;c.fillStyle='#3a2a18';c.fill(band,'evenodd');c.restore();
  c.save();c.clip(band,'evenodd');c.fillStyle='#2e2012';c.fillRect(cx-R-T,cy-R-T,2*R+2*T,2*R+2*T);
  const r=rng(5),step=T*.34,n=Math.round(TAU*R/step);
  for(let i=0;i<n;i++){const a=i/n*TAU,x=cx+Math.cos(a)*R,y=cy+Math.sin(a)*R;
    c.save();c.translate(x,y);c.rotate(a+Math.PI/2+1.0);
    const v=.9+r()*.2,base=[180*v,141*v,88*v];
    const g=c.createLinearGradient(0,-T*.24,0,T*.24);
    g.addColorStop(0,`rgb(${base[0]*1.25|0},${base[1]*1.22|0},${base[2]*1.15|0})`);g.addColorStop(.45,`rgb(${base[0]|0},${base[1]|0},${base[2]|0})`);g.addColorStop(1,`rgb(${base[0]*.45|0},${base[1]*.42|0},${base[2]*.38|0})`);
    c.beginPath();c.ellipse(0,0,T*.66,T*.22,0,0,TAU);c.fillStyle=g;c.fill();c.strokeStyle='rgba(40,24,10,.8)';c.lineWidth=1.3;c.stroke();
    c.strokeStyle='rgba(255,236,190,.22)';c.lineWidth=.9;for(let f=-1;f<=1;f++){c.beginPath();c.moveTo(-T*.5,f*T*.07-1);c.quadraticCurveTo(0,f*T*.09-2,T*.5,f*T*.07-1);c.stroke()}
    c.restore()}
  // cylinder shading across the rope and a key light from the top left
  let g=c.createRadialGradient(cx,cy,R-T/2,cx,cy,R+T/2);g.addColorStop(0,'rgba(0,0,0,.55)');g.addColorStop(.38,'rgba(0,0,0,0)');g.addColorStop(.62,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.6)');c.fillStyle=g;c.fillRect(0,0,W,H);
  c.globalCompositeOperation='soft-light';g=c.createLinearGradient(cx-R,cy-R,cx+R,cy+R);g.addColorStop(0,'rgba(255,240,200,.9)');g.addColorStop(1,'rgba(0,0,0,.9)');c.fillStyle=g;c.fillRect(0,0,W,H);
  c.restore()}
function lashing(c,cx,cy,R,T,a){c.save();c.translate(cx+Math.cos(a)*R,cy+Math.sin(a)*R);c.rotate(a);
  for(let k=-2;k<=2;k++){const p=rr(-T*.72,k*6.4-2.6,T*1.44,5.6,2.8);const g=c.createLinearGradient(-T*.7,0,T*.7,0);g.addColorStop(0,'#5d4526');g.addColorStop(.35,'#e3c995');g.addColorStop(1,'#4a361e');
    c.fillStyle=g;c.save();c.shadowBlur=3;c.shadowColor='rgba(0,0,0,.7)';c.shadowOffsetY=1;c.fill(p);c.restore()}
  c.restore()}
let LEATHER_DISC;
function medallion(c,x,y,r,sel){
  if(sel){const g=c.createRadialGradient(x,y,r*.6,x,y,r*2.1);g.addColorStop(0,'rgba(255,200,110,.55)');g.addColorStop(1,'rgba(255,170,70,0)');c.fillStyle=g;c.beginPath();c.arc(x,y,r*2.1,0,TAU);c.fill()}
  const disc=new Path2D();disc.arc(x,y,r-9,0,TAU);
  dropShadow(c,disc,20,'rgba(0,0,0,.75)',3,10);
  c.save();c.clip(disc);c.drawImage(LEATHER_DISC,x-r,y-r,2*r,2*r);c.restore();
  innerShadow(c,disc,18,'rgba(0,0,0,.85)',2,6);
  brassRing(c,x,y,r,r-10);
  for(let i=0;i<8;i++){const a=i/8*TAU+TAU/16;rivet(c,x+Math.cos(a)*(r-5),y+Math.sin(a)*(r-5),2.6)}
  if(sel){c.save();c.strokeStyle='rgba(255,226,150,.85)';c.lineWidth=2;c.shadowBlur=14;c.shadowColor='rgba(255,200,100,.9)';c.beginPath();c.arc(x,y,r+1,0,TAU);c.stroke();c.restore()}
}
/* ---- painted tools, drawn in a 100-unit box around the origin ---- */
function toolCompass(c){
  const caseG=c.createRadialGradient(-12,-14,4,0,0,42);caseG.addColorStop(0,'#ffe9a8');caseG.addColorStop(.35,'#d3a14a');caseG.addColorStop(.8,'#7a5216');caseG.addColorStop(1,'#3d2808');
  c.save();c.shadowBlur=10;c.shadowColor='rgba(0,0,0,.7)';c.shadowOffsetY=5;c.fillStyle=caseG;c.beginPath();c.arc(0,0,40,0,TAU);c.fill();c.restore();
  c.lineWidth=4;c.strokeStyle=brassGrad(c,0,-46,0,-36);c.beginPath();c.arc(0,-46,7,0,TAU);c.stroke();
  const dial=c.createRadialGradient(-6,-6,2,0,0,31);dial.addColorStop(0,'#f6ead0');dial.addColorStop(1,'#cdb27c');c.fillStyle=dial;c.beginPath();c.arc(0,0,31,0,TAU);c.fill();
  c.strokeStyle='#3a2616';for(let i=0;i<32;i++){const a=i/32*TAU,r0=i%8?27:23;c.lineWidth=i%8?.8:1.6;c.beginPath();c.moveTo(Math.cos(a)*r0,Math.sin(a)*r0);c.lineTo(Math.cos(a)*30,Math.sin(a)*30);c.stroke()}
  c.font='700 9px "IM Fell English SC",serif';c.fillStyle='#3a2616';c.textAlign='center';c.textBaseline='middle';c.fillText('N',0,-16);
  c.save();c.rotate(-.5);c.shadowBlur=3;c.shadowColor='rgba(0,0,0,.5)';c.shadowOffsetY=2;
  c.fillStyle='#a8321f';c.beginPath();c.moveTo(0,-26);c.lineTo(5,0);c.lineTo(-5,0);c.fill();c.fillStyle='#27272a';c.beginPath();c.moveTo(0,26);c.lineTo(5,0);c.lineTo(-5,0);c.fill();c.restore();
